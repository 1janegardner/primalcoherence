backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:

  - name: "home"
    label: "Home Page"
    files:
      - name: "home"
        label: "Home Page"
        file: "_content/home.json"
        fields:
          - label: "Hero heading"
            name: "hero_heading"
            widget: "string"
            hint: "The big headline on the front page"
          - label: "Hero subtext"
            name: "hero_sub"
            widget: "text"
            hint: "The paragraph under the headline"
          - label: "About — short bio"
            name: "about_short"
            widget: "text"
            hint: "Short bio shown on the home page"
          - label: "About — second line"
            name: "about_short_2"
            widget: "text"
            hint: "Second sentence in the home page about snippet"
          - label: "Sliding scale quote"
            name: "scale_quote"
            widget: "string"
            hint: "The quote in the orange section"
          - label: "Sliding scale subtext"
            name: "scale_sub"
            widget: "text"
            hint: "Text under the quote"
          - label: "Sliding scale note"
            name: "scale_note"
            widget: "string"
            hint: "Smaller italic line under the subtext"
          - label: "Booking heading"
            name: "booking_heading"
            widget: "string"
            hint: "The heading in the dark green booking section"
          - label: "Booking subtext"
            name: "booking_sub"
            widget: "text"
            hint: "Text under the booking heading"

  - name: "about"
    label: "About Jane Page"
    files:
      - name: "about"
        label: "About Jane"
        file: "_content/about.json"
        fields:
          - label: "Page intro"
            name: "page_intro"
            widget: "text"
            hint: "Intro line under the hero heading"
          - label: "Story — paragraph 1"
            name: "p1"
            widget: "text"
          - label: "Story — paragraph 2"
            name: "p2"
            widget: "text"
          - label: "Story — paragraph 3 (short)"
            name: "p3"
            widget: "string"
          - label: "Story — paragraph 4"
            name: "p4"
            widget: "text"
          - label: "Story — paragraph 5"
            name: "p5"
            widget: "text"
          - label: "Story — paragraph 6"
            name: "p6"
            widget: "text"
          - label: "Pull quote"
            name: "pull_quote"
            widget: "string"
            hint: "The large italic quote in the middle"
          - label: "Story — paragraph 7"
            name: "p7"
            widget: "text"
          - label: "Story — paragraph 8"
            name: "p8"
            widget: "text"
          - label: "Story — paragraph 9"
            name: "p9"
            widget: "text"
          - label: "Story — paragraph 10"
            name: "p10"
            widget: "text"
          - label: "Story — paragraph 11 (closing)"
            name: "p11"
            widget: "text"
          - label: "Emotion & Body Code — how it found me"
            name: "found_emotion"
            widget: "text"
          - label: "Kambo — how it found me"
            name: "found_kambo"
            widget: "text"
          - label: "ERT — how it found me"
            name: "found_ert"
            widget: "text"
          - label: "Biofield Tuning — how it found me"
            name: "found_biofield"
            widget: "text"

  - name: "modalities"
    label: "Modality Pages"
    files:
      - name: "ert"
        label: "ERT — tagline"
        file: "_content/ert.json"
        fields:
          - label: "Page intro (hero paragraph)"
            name: "intro"
            widget: "text"
            hint: "The paragraph shown in the dark hero section"
      - name: "biofield"
        label: "Biofield Tuning — tagline"
        file: "_content/biofield.json"
        fields:
          - label: "Page intro (hero paragraph)"
            name: "intro"
            widget: "text"
      - name: "kambo"
        label: "Kambo — tagline"
        file: "_content/kambo.json"
        fields:
          - label: "Page intro (hero paragraph)"
            name: "intro"
            widget: "text"
      - name: "genesis"
        label: "Genesis Bowl — tagline"
        file: "_content/genesis.json"
        fields:
          - label: "Page intro (hero paragraph)"
            name: "intro"
            widget: "text"
      - name: "emotion-code"
        label: "Emotion & Body Code — tagline"
        file: "_content/emotion-code.json"
        fields:
          - label: "Page intro (hero paragraph)"
            name: "intro"
            widget: "text"
      - name: "rape"
        label: "Rapé — tagline"
        file: "_content/rape.json"
        fields:
          - label: "Page intro (hero paragraph)"
            name: "intro"
            widget: "text"
      - name: "sananga"
        label: "Sananga — tagline"
        file: "_content/sananga.json"
        fields:
          - label: "Page intro (hero paragraph)"
            name: "intro"
            widget: "text"
